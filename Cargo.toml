[package]
name = "herdlite"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pengganti Laravel Herd yang sangat ringan untuk Windows: situs <folder>.test, PHP per situs, park/link, HTTPS lokal."

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "fs", "macros"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
ring = "0.17"
time = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
