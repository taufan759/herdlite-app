<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="herdlite-token" content="{{TOKEN}}">
<title>herdlite</title>
<style>
:root{color-scheme:light dark;--bg:#fafaf9;--card:#ffffff;--fg:#1c1917;--dim:#78716c;--line:#e7e5e4;--acc:#dc2626;--acc-fg:#fff;--ok:#15803d;--warn-bg:#fef3c7;--warn-fg:#78350f}
@media (prefers-color-scheme:dark){:root{--bg:#1c1917;--card:#292524;--fg:#f5f5f4;--dim:#a8a29e;--line:#44403c;--acc:#f87171;--acc-fg:#1c1917;--ok:#4ade80;--warn-bg:#422006;--warn-fg:#fde68a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:1040px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
header h1{font-size:20px;margin:0;flex:1}
.dim{color:var(--dim)}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
input{min-width:0;flex:1}
button{cursor:pointer;white-space:nowrap}
button.primary{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
button:disabled{opacity:.5;cursor:default}
.banner{background:var(--warn-bg);color:var(--warn-fg);border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner span{flex:1}
[hidden]{display:none !important}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--dim);font-size:12px}
td.path{color:var(--dim);font-size:12px;word-break:break-all}
td.act{white-space:nowrap;text-align:right}
td.act button{padding:4px 8px;font-size:12px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin:2px 4px 2px 0}
.chip.on{border-color:var(--ok);color:var(--ok)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
@media (max-width:640px){td.path,th.path{display:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>herdlite <span class="dim" id="ver"></span></h1>
    <label class="row">PHP global <select id="global"></select></label>
  </header>

  <div class="banner" id="hosts" hidden>
    <span id="hosts-text"></span>
    <button class="primary" id="hosts-btn">Daftarkan sekarang</button>
  </div>

  <section class="card">
    <h2>Situs baru</h2>
    <div class="row">
      <input id="new-name" placeholder="nama-situs (huruf kecil, angka, tanda -)" autocomplete="off">
      <button class="primary" id="new-btn">Buat</button>
      <button id="open-sites">Buka folder proyek</button>
    </div>
    <p class="dim" id="sites-hint"></p>
  </section>

  <section class="card">
    <h2>Situs (<span id="count">0</span>)</h2>
    <table>
      <thead><tr><th>Situs</th><th>PHP</th><th class="path">Folder</th><th></th></tr></thead>
      <tbody id="sites"></tbody>
    </table>
  </section>

  <section class="card">
    <h2>Versi PHP</h2>
    <div id="php-list"></div>
    <div class="row" style="margin-top:8px">
      <select id="php-new"></select>
      <button id="php-install">Pasang</button>
      <span class="dim" id="php-job"></span>
    </div>
  </section>

  <p class="dim" id="foot"></p>
</main>
<div class="toast" id="toast"></div>
<script>
"use strict";
const TOKEN = document.querySelector('meta[name="herdlite-token"]').content;
const $ = (id) => document.getElementById(id);
let state = null;
let polling = null;

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.h);
  toast.h = setTimeout(() => t.classList.remove("show"), 3500);
}

async function api(action, body) {
  const r = await fetch("/__herdlite/api/" + action, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Herdlite-Token": TOKEN },
    body: JSON.stringify(body || {}),
  });
  const j = await r.json().catch(() => ({ ok: false, error: "respons tidak valid" }));
  if (!j.ok) throw new Error(j.error || "gagal");
  return j;
}

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids) if (k != null) e.append(k);
  return e;
}

function option(value, label, selected) {
  return el("option", { value, text: label, selected: selected || false });
}

async function act(btn, action, body, okMsg) {
  if (btn) btn.disabled = true;
  try {
    const j = await api(action, body);
    if (okMsg || j.message) toast(j.message || okMsg);
    await load();
    return j;
  } catch (e) {
    toast("✗ " + e.message);
  } finally {
    if (btn) btn.disabled = false;
  }
}

function render() {
  const s = state;
  $("ver").textContent = s.version;
  document.title = "herdlite · " + s.sites.length + " situs";

  const g = $("global");
  g.replaceChildren(...s.php_installed.map((v) => option(v, v, v === s.php_global)));
  if (!s.php_installed.length) g.append(option("", "belum ada", true));

  const miss = s.hosts_missing;
  $("hosts").hidden = miss.length === 0;
  $("hosts-text").textContent = miss.length + " nama belum terdaftar di Windows (" + miss.slice(0, 4).join(", ") + (miss.length > 4 ? ", …" : "") + "). Klik lalu pilih Yes pada jendela izin.";

  $("sites-hint").textContent = s.sites_dir
    ? "Situs baru dibuat di " + s.sites_dir + ". Setiap folder di sana otomatis menjadi <nama>." + s.tld
    : "Belum ada folder proyek. Jalankan: hl park <folder>";

  $("count").textContent = s.sites.length;
  const rows = s.sites.map((site) => {
    const sel = el("select", { "aria-label": "Versi PHP " + site.host, onchange: (e) => act(null, "set_php", { site: site.name, version: e.target.value }, "PHP " + site.host + " diubah") },
      option("", "Global (" + (s.php_global || "-") + ")", !site.isolated),
      ...s.php_installed.map((v) => option(v, v, site.isolated && site.php === v)));
    return el("tr", {},
      el("td", {}, el("a", { href: site.url, target: "_blank", rel: "noopener", text: site.host })),
      el("td", {}, sel),
      el("td", { class: "path", text: site.path }),
      el("td", { class: "act" },
        el("button", { text: "Folder", title: "Buka folder di Explorer", onclick: (e) => act(e.target, "open_folder", { site: site.name }) }), " ",
        el("button", { text: "Terminal", title: "Buka terminal di folder ini", onclick: (e) => act(e.target, "open_terminal", { site: site.name }) })));
  });
  $("sites").replaceChildren(...rows);

  $("php-list").replaceChildren(...s.php_installed.map((v) =>
    el("span", { class: "chip" + (s.php_running.includes(v) ? " on" : ""), title: s.php_running.includes(v) ? "sedang berjalan" : "", text: "PHP " + v + (v === s.php_global ? " · global" : "") })));
  const avail = s.php_installable.filter((v) => !s.php_installed.includes(v));
  $("php-new").replaceChildren(...avail.map((v) => option(v, "PHP " + v)));
  $("php-new").disabled = $("php-install").disabled = avail.length === 0 || !!s.job;
  $("php-job").textContent = s.job || s.job_result || "";

  $("foot").textContent = "HTTP :" + s.http_port + (s.https_port ? " · HTTPS :" + s.https_port : "") + " · php-cgi aktif: " + (s.php_running.join(", ") || "tidak ada (menyala saat dibutuhkan)");

  if (s.job && !polling) polling = setInterval(load, 2000);
  if (!s.job && polling) { clearInterval(polling); polling = null; }
}

async function load() {
  try {
    const r = await fetch("/__herdlite/api/state", { headers: { "X-Herdlite-Token": TOKEN } });
    state = await r.json();
    render();
  } catch (e) {
    $("foot").textContent = "Tidak bisa terhubung ke server herdlite.";
  }
}

$("global").addEventListener("change", (e) => act(null, "set_global", { version: e.target.value }, "PHP global sekarang " + e.target.value));
$("hosts-btn").addEventListener("click", (e) => act(e.target, "hosts_sync", {}, "Pilih Yes pada jendela izin Windows…"));
$("open-sites").addEventListener("click", (e) => act(e.target, "open_sites_dir", {}));
$("php-install").addEventListener("click", (e) => act(e.target, "install_php", { version: $("php-new").value }));
async function createSite() {
  const name = $("new-name").value.trim().toLowerCase();
  if (!name) return;
  const j = await act($("new-btn"), "new_site", { name });
  if (j) $("new-name").value = "";
}
$("new-btn").addEventListener("click", createSite);
$("new-name").addEventListener("keydown", (e) => { if (e.key === "Enter") createSite(); });
window.addEventListener("focus", load);
load();
</script>
</body>
</html>
