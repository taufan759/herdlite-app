name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable
        run: rustup default stable

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Installer
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and "v$v" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME tidak sama dengan versi Cargo.toml ($v)"
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\herdlite.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC gagal' }
          $exe = Get-Item "installer\Output\herdlite-setup-$v.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii "installer\Output\herdlite-setup-$v.exe.sha256"
          "Ukuran: {0:N2} MB, SHA-256: {1}" -f ($exe.Length / 1MB), $hash

      - uses: actions/upload-artifact@v4
        with:
          name: herdlite-installer
          path: installer/Output/*

      - name: Rilis GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*
          generate_release_notes: true
